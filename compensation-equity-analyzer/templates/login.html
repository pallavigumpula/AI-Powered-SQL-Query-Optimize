<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | YottaFlex.ai Compensation Equity Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.1);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="login-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
        <i class="bi bi-shield-check"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">YottaFlex.ai</h4>
      <p class="text-muted small">Compensation Equity Analyzer &bull; Disparity Detection System</p>
    </div>

    <form action="/auth/login" method="POST">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
          <input type="text" name="username" id="usernameInput" class="form-control border-start-0" value="hr_partner" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" name="password" id="passwordInput" class="form-control border-start-0" value="demo123" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
        Sign In to Analyzer
      </button>
    </form>

    <div class="border-top pt-3 mt-3">
      <div class="text-muted small fw-semibold mb-2 text-center">Quick Demo Login (Select Role):</div>
      <div class="d-flex flex-wrap gap-1 justify-content-center">
        <button class="btn btn-sm btn-outline-secondary" onclick="fillCreds('employee', 'demo123')">Employee</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="fillCreds('manager', 'demo123')">Manager</button>
        <button class="btn btn-sm btn-outline-primary" onclick="fillCreds('hr_partner', 'demo123')">HR Partner</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="fillCreds('it_ops', 'demo123')">IT / Ops</button>
        <button class="btn btn-sm btn-outline-dark" onclick="fillCreds('admin', 'admin123')">Admin</button>
      </div>
    </div>
  </div>

  <script>
    function fillCreds(u, p) {
      document.getElementById('usernameInput').value = u;
      document.getElementById('passwordInput').value = p;
    }
  </script>
</body>
</html>
