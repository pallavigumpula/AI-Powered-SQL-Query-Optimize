version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sql_optimizer
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  optimizer-ui:
    build: .
    restart: always
    ports:
      - "8501:8501"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=sql_optimizer
    depends_on:
      - db

  optimizer-api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=sql_optimizer
    depends_on:
      - db

volumes:
  mysql_data:
